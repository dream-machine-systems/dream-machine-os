name: Errata
description: Typo, wrong number, broken link or contradiction in the spec or the book.
title: "[ERRATA] "
labels: ["type:errata", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public and permanent. Do not include personal or health data.
        No GitHub account? Use the [Feedback Compiler](https://www.dreammachine.systems/feedback). Same categories, same backlog.
        **Safety concerns never go here.** Report them privately via the Feedback Compiler (category "Safety concern").
  - type: dropdown
    id: location
    attributes:
      label: Where
      options:
        - Spec (this repository)
        - eBook
        - Audiobook
        - Print
        - Website
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build version
      placeholder: v0.9.5
  - type: input
    id: section
    attributes:
      label: Module, chapter or section
      placeholder: "09-love-protocol / CH 9.3 / Directory C"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Typo / grammar
        - Wrong fact or number
        - Source / citation
        - Broken link or reference
        - Logic gap / missing explanation
        - Unclear wording or metaphor
        - Tone (guru bug, toxic positivity, hustle culture)
        - Contradiction between modules or chapters
        - Other
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
