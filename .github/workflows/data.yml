name: Data

on:
  # Runs on every PR (no path filter) so it can be a required status check.
  pull_request:
  push:
    branches: [main]
    paths:
      - "errors/**"
      - "glossary/**"
      - "audit/**"
      - "deck/**"
      - "modules/**"
      - "scripts/check-data.mjs"
      - ".github/workflows/data.yml"

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-data.mjs
