name: Links

# Weekly check of every link in the Markdown files: the website, DOIs and
# journal pages change without notice. Not a PR check, so an outside site
# that is down never blocks a contribution. A failed run opens an issue.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,206,429
            --exclude-path node_modules
            "./**/*.md"
          fail: false
          output: lychee/out.md
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Broken links ($(date -u +%Y-%m-%d))" \
            --label "type:errata" \
            --body-file lychee/out.md
