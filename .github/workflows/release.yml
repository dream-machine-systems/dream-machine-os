name: Release

# Every build in CHANGELOG.md gets its tag and its GitHub release, without a
# manual step.
#
# - Push to main that touches CHANGELOG.md (the release PR) or this workflow:
#   for every "## [X.Y.Z] – YYYY-MM-DD" section without a tag, the tag vX.Y.Z
#   is set on the commit of main that added that heading, and the release is
#   published. Versions with a suffix (X.Y.Z-ALPHA) are never tagged here.
# - Push of a tag v* (set by hand): the release for that tag is published.
# - "Run workflow": with a tag, (re)publishes that release; without one, runs
#   the same reconcile as a push to main.
#
# Notes come from scripts/release.mjs: the CHANGELOG section of the build on
# main, the commits merged since the previous build and a compare link. A tag
# with a suffix becomes a pre-release; the newest plain build becomes "Latest".
# Tags pushed by this workflow do not trigger it again (GITHUB_TOKEN).

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "scripts/release.mjs"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.9.6; empty = tag and publish every missing build"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish() { # publish <tag> <latest|older>
            local tag="$1" latest="$2"
            node scripts/release.mjs notes "$tag" > notes.md
            local flags=(--title "Build $tag" --notes-file notes.md)
            case "$tag" in
              *-*) flags+=(--prerelease --latest=false) ;;
              *) if [ "$latest" = "latest" ]; then flags+=(--latest); else flags+=(--latest=false); fi ;;
            esac
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" "${flags[@]}"
            else
              gh release create "$tag" --verify-tag "${flags[@]}"
            fi
            echo "published $tag"
          }

          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            latest=$(node scripts/release.mjs plan | awk -v t="$tag" '$1 == t { print $4 }')
            publish "$tag" "${latest:-older}"
            exit 0
          fi

          node scripts/release.mjs plan > plan.txt
          cat plan.txt
          while read -r tag commit state latest; do
            if [ "$state" = "missing" ]; then
              git tag -a "$tag" "$commit" -m "Build $tag"
              git push origin "refs/tags/$tag"
              publish "$tag" "$latest"
            elif ! gh release view "$tag" >/dev/null 2>&1; then
              publish "$tag" "$latest"
            fi
          done < plan.txt
